<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         INFORMACIÓN GENERAL
    ====================================================== -->

    <title>Alekey</title>

    <meta
      name="description"
      content="Sistema de gestión administrativa de Alekey para ventas, pedidos, inventario, usuarios y estadísticas."
    />

    <meta
      name="application-name"
      content="Alekey"
    />

    <meta
      name="theme-color"
      content="#8ED4BE"
    />

    <!-- =====================================================
         FAVICONS
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <!-- =====================================================
         APPLE / IOS
    ====================================================== -->

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Alekey"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- =====================================================
         ANDROID / WEB APP
    ====================================================== -->

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- =====================================================
         OPEN GRAPH
         WhatsApp / Facebook / Discord / LinkedIn
    ====================================================== -->

    <meta
      property="og:title"
      content="Alekey"
    />

    <meta
      property="og:description"
      content="Sistema de gestión administrativa de Alekey."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://alekey-app.vercel.app"
    />

    <meta
      property="og:image"
      content="https://alekey-app.vercel.app/alekey.png"
    />

    <meta
      property="og:image:alt"
      content="Alekey"
    />

    <meta
      property="og:site_name"
      content="Alekey"
    />

    <meta
      property="og:locale"
      content="es_CR"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Alekey"
    />

    <meta
      name="twitter:description"
      content="Sistema de gestión administrativa de Alekey."
    />

    <meta
      name="twitter:image"
      content="https://alekey-app.vercel.app/alekey.png"
    />

    <!-- =====================================================
         ANIMATE.CSS
    ====================================================== -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
